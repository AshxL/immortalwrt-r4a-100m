name: Extract Firmware DTS Flash Layout
on:
  workflow_dispatch: # 允许手动在 Actions 页面点击触发

jobs:
  extract-dts:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk device-tree-compiler python3 wget xz-utils

      - name: Download Firmware
        run: |
          wget -O firmware.bin "https://raw.githubusercontent.com/kily-smith/MI-4A100M/refs/heads/main/%E3%80%90Lean%E3%80%912021-3-17%20openwrt-ramips-mt76x8-xiaomi_mir4a-100m-squashfs-sysupgrade.bin"

      - name: Unpack Firmware (binwalk)
        run: |
          echo "正在解包固件..."
          # 使用 -Me 参数递归解包（OpenWrt的内核通常被LZMA压缩，需要解压后才能看到DTB）
          binwalk -Me firmware.bin || true

      - name: Carve DTB Files (Python 提取器)
        run: |
          # 编写并执行一段 Python 脚本，通过 DTB 魔数特征提取设备树
          cat << 'EOF' > carve_dtb.py
          import os, struct
          
          def extract_dtb(directory):
              os.makedirs("dtbs", exist_ok=True)
              dtb_count = 0
              for root, dirs, files in os.walk(directory):
                  for file in files:
                      filepath = os.path.join(root, file)
                      if os.path.islink(filepath) or not os.path.isfile(filepath): continue
                      try:
                          with open(filepath, 'rb') as f: data = f.read()
                          magic = b'\xd0\x0d\xfe\xed' # DTB Magic Number
                          idx = 0
                          while True:
                              idx = data.find(magic, idx)
                              if idx == -1: break
                              if idx + 8 <= len(data):
                                  size = struct.unpack('>I', data[idx+4:idx+8])[0]
                                  # 过滤大小（一般DTB文件在1KB~2MB之间）
                                  if 1024 < size < 2097152: 
                                      dtb_path = f"dtbs/extracted_{dtb_count}.dtb"
                                      with open(dtb_path, 'wb') as out_f:
                                          out_f.write(data[idx:idx+size])
                                      print(f"✅ 在文件 {filepath} 中发现 DTB (偏移: {hex(idx)}, 大小: {size} 字节)")
                                      dtb_count += 1
                              idx += 4
                      except Exception as e:
                          pass
          
          extract_dtb(".")
          EOF
          python3 carve_dtb.py

      - name: Decompile DTB to DTS and Extract Layout
        run: |
          mkdir -p dts_output
          if [ -d "dtbs" ] && [ "$(ls -A dtbs)" ]; then
            for dtb in dtbs/*.dtb; do
              base=$(basename "$dtb" .dtb)
              dts_file="dts_output/${base}.dts"
              echo "🔄 正在反编译 $dtb -> $dts_file"
              # dtc 反编译
              dtc -I dtb -O dts -o "$dts_file" "$dtb" || true
              
              echo "==================================================="
              echo "👉 闪存布局分区信息 (Flash Layout for ${base}):"
              # 在日志中过滤并打印分区节点结构供快速预览，提取 `partition` 相关的代码块
              grep -A 40 -B 2 -i "partition" "$dts_file" || true
              echo "==================================================="
            done
          else
            echo "❌ 未能找到任何 DTB 文件！"
            exit 1
          fi

      - name: Upload DTS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dts-source
          path: dts_output/*.dts
