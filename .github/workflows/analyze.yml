name: Extract Multiple Firmware DTS
on:
  workflow_dispatch: # 手动触发

jobs:
  extract-dts:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk device-tree-compiler python3 git xz-utils

      - name: Clone Firmware Repository
        run: |
          echo "正在克隆目标仓库..."
          git clone https://github.com/kily-smith/MI-4A100M.git target_repo

      - name: Create DTB Extractor Script
        run: |
          # 创建 Python 提取脚本，支持接收目录作为参数
          cat << 'EOF' > carve_dtb.py
          import os, struct, sys
          
          def extract_dtb(directory):
              os.makedirs("dtbs", exist_ok=True)
              dtb_count = 0
              for root, dirs, files in os.walk(directory):
                  for file in files:
                      filepath = os.path.join(root, file)
                      if os.path.islink(filepath) or not os.path.isfile(filepath): continue
                      try:
                          with open(filepath, 'rb') as f: data = f.read()
                          magic = b'\xd0\x0d\xfe\xed' # DTB 魔数
                          idx = 0
                          while True:
                              idx = data.find(magic, idx)
                              if idx == -1: break
                              if idx + 8 <= len(data):
                                  size = struct.unpack('>I', data[idx+4:idx+8])[0]
                                  # 过滤大小 (1KB ~ 2MB)
                                  if 1024 < size < 2097152: 
                                      dtb_path = f"dtbs/extracted_{dtb_count}.dtb"
                                      with open(dtb_path, 'wb') as out_f:
                                          out_f.write(data[idx:idx+size])
                                      print(f"  ✅ [DTB 发现] 文件: {filepath} | 偏移: {hex(idx)} | 大小: {size} 字节")
                                      dtb_count += 1
                              idx += 4
                      except Exception as e:
                          pass
              return dtb_count
          
          if __name__ == "__main__":
              target_dir = sys.argv[1] if len(sys.argv) > 1 else "."
              count = extract_dtb(target_dir)
              if count == 0:
                  print("  ❌ 未找到任何 DTB 文件。")
          EOF

      - name: Process All Bin Files
        run: |
          mkdir -p all_dts_outputs
          
          # 查找仓库下的所有 .bin 文件并循环处理 (支持带有空格的中文文件名)
          find target_repo -type f -name "*.bin" | while read -r bin_file; do
            filename=$(basename "$bin_file")
            echo -e "\n========================================================================"
            echo "🚀 正在处理固件: $filename"
            echo "========================================================================"
            
            # 为每个固件创建一个独立的工作目录，防止解包文件互相干扰
            # 使用 md5 哈希作为目录名防止文件名特殊字符导致错误
            safe_dir="workdir_$(echo "$filename" | md5sum | awk '{print $1}')"
            mkdir -p "$safe_dir"
            cp "$bin_file" "$safe_dir/"
            
            pushd "$safe_dir" > /dev/null
            
            echo "📦 步骤 1/3: 正在使用 binwalk 递归解包..."
            binwalk -Me "$filename" > /dev/null 2>&1 || true
            
            echo "🔍 步骤 2/3: 正在扫描并提取设备树 DTB..."
            python3 ../carve_dtb.py .
            
            echo "📜 步骤 3/3: 反编译 DTB 为 DTS 并提取闪存布局..."
            if [ -d "dtbs" ] && [ "$(ls -A dtbs 2>/dev/null)" ]; then
              for dtb in dtbs/*.dtb; do
                dtb_base=$(basename "$dtb" .dtb)
                # 为输出的 dts 文件添加当前 bin 文件的名字作为前缀，方便区分
                dts_name="${filename}_${dtb_base}.dts"
                dts_path="../all_dts_outputs/${dts_name}"
                
                # dtc 反编译
                dtc -I dtb -O dts -o "$dts_path" "$dtb" 2>/dev/null || true
                
                echo -e "\n---------------------------------------------------"
                echo "👉 [$filename] 的闪存布局 (Partition Layout):"
                # 过滤输出 partition 相关内容供日志预览
                grep -A 40 -B 2 -i "partition" "$dts_path" || echo "  ⚠️ 未找到 partition 节点"
                echo "---------------------------------------------------"
              done
            else
              echo "  ❌ 该固件中没有提取到有效的设备树信息。"
            fi
            
            popd > /dev/null
          done

      - name: Upload All DTS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-firmwares-dts
          path: all_dts_outputs/*.dts
