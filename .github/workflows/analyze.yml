name: Analyze R4A 100M Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze reference firmware
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. Checkout only the workflow repository
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Clone the known working R4A 100M firmware repository
      # ==========================================================
      - name: Clone reference repository
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          REPO="$ROOT/reference-repo"

          rm -rf "$REPO"

          git clone \
            --depth=1 \
            https://github.com/kily-smith/MI-4A100M.git \
            "$REPO"

          echo "============================================================"
          echo "REFERENCE REPOSITORY"
          echo "============================================================"

          git -C "$REPO" remote -v
          echo
          echo "Commit:"
          git -C "$REPO" rev-parse HEAD

          echo
          echo "Repository files:"
          find "$REPO" -maxdepth 3 -type f -print | sort

      # ==========================================================
      # 3. Locate the exact Lean 2021-03-17 R4A 100M sysupgrade BIN
      #
      # Fail if zero OR multiple candidates are found.
      # ==========================================================
      - name: Locate exact firmware
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          REPO="$ROOT/reference-repo"

          mapfile -t CANDIDATES < <(
            find "$REPO" \
              -type f \
              -name '*2021-3-17*openwrt-ramips-mt76x8-xiaomi_mir4a-100m-squashfs-sysupgrade.bin' \
              -print
          )

          echo "Candidate count: ${#CANDIDATES[@]}"

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo
            echo "ERROR: Exact Lean 2021-03-17 firmware was not found."
            echo
            echo "All BIN files:"
            find "$REPO" -type f -iname '*.bin' -print | sort
            exit 1
          fi

          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo
            echo "ERROR: Multiple matching firmware files were found:"
            printf '%s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          BIN="${CANDIDATES[0]}"

          echo "Exact firmware:"
          echo "$BIN"

          printf '%s\n' "$BIN" > "$ROOT/firmware-path.txt"

      # ==========================================================
      # 4. Run one single, self-contained Python analyzer
      # ==========================================================
      - name: Analyze firmware and source layout
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BIN="$(cat "$ROOT/firmware-path.txt")"
          REPORT="$ROOT/r4a-100m-analysis.txt"

          python3 - "$BIN" "$ROOT/reference-repo" "$REPORT" <<'PY'
          import os
          import sys
          import struct
          import hashlib
          import subprocess
          from pathlib import Path

          BIN = Path(sys.argv[1]).resolve()
          REPO = Path(sys.argv[2]).resolve()
          REPORT = Path(sys.argv[3]).resolve()

          if not BIN.is_file():
              raise SystemExit(f"ERROR: BIN does not exist: {BIN}")

          if not REPO.is_dir():
              raise SystemExit(f"ERROR: repository does not exist: {REPO}")

          data = BIN.read_bytes()
          size = len(data)

          def hx(v):
              return f"0x{v:08X}"

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def find_all(blob, magic):
              result = []
              start = 0
              while True:
                  p = blob.find(magic, start)
                  if p < 0:
                      break
                  result.append(p)
                  start = p + 1
              return result

          def run_git(*args):
              try:
                  return subprocess.check_output(
                      ["git", "-C", str(REPO), *args],
                      text=True,
                      stderr=subprocess.STDOUT
                  ).strip()
              except Exception as e:
                  return f"<git command failed: {e}>"

          lines = []

          def out(s=""):
              lines.append(str(s))

          out("=" * 72)
          out("XIAOMI MI ROUTER 4A 100M FIRMWARE ANALYSIS")
          out("=" * 72)
          out()

          out("REFERENCE REPOSITORY")
          out("-" * 72)
          out(f"Repository: {run_git('remote', 'get-url', 'origin')}")
          out(f"Commit:    {run_git('rev-parse', 'HEAD')}")
          out()

          out("FIRMWARE")
          out("-" * 72)
          out(f"Path:      {BIN}")
          out(f"Bytes:     {size}")
          out(f"KiB:       {size / 1024:.2f}")
          out(f"MiB:       {size / 1024 / 1024:.6f}")
          out(f"SHA256:    {sha256(BIN)}")
          out()

          out("=" * 72)
          out("IMPORTANT: BIN OFFSET IS NOT FLASH OFFSET")
          out("=" * 72)
          out()
          out("A sysupgrade.bin normally represents the contents written")
          out("into the firmware MTD partition.")
          out()
          out("Therefore:")
          out()
          out("    BIN offset 0x00000000")
          out("        != automatically Flash offset 0x00000000")
          out()
          out("The actual Flash address is determined by the DTS partition")
          out("layout / bootloader / flashing procedure.")
          out()

          # ------------------------------------------------------
          # uImage
          # ------------------------------------------------------
          out("=" * 72)
          out("U-IMAGE SCAN")
          out("=" * 72)

          uimages = find_all(data, b"\x27\x05\x19\x56")

          if not uimages:
              out("No uImage magic found.")
          else:
              for n, pos in enumerate(uimages, 1):
                  out()
                  out(f"[uImage #{n}] BIN offset = {hx(pos)} ({pos})")

                  if pos + 64 > size:
                      out("  ERROR: incomplete uImage header")
                      continue

                  fields = struct.unpack_from(">7I4B", data, pos)

                  magic, hcrc, timestamp, payload_size, load, entry, dcrc, \
                      os_id, arch, image_type, compression = fields

                  name_raw = data[pos + 32:pos + 64]
                  name = name_raw.split(b"\0", 1)[0].decode(
                      "ascii",
                      errors="replace"
                  )

                  payload_start = pos + 64
                  payload_end = payload_start + payload_size

                  out(f"  Header size:       64 bytes")
                  out(f"  Payload size:      {payload_size} bytes")
                  out(f"  Payload size:      {payload_size / 1024:.2f} KiB")
                  out(f"  Payload start:     {hx(payload_start)}")
                  out(f"  Payload end:       {hx(payload_end)}")
                  out(f"  Load address:      {hx(load)}")
                  out(f"  Entry point:       {hx(entry)}")
                  out(f"  OS ID:             {os_id}")
                  out(f"  Architecture:      {arch}")
                  out(f"  Image type:        {image_type}")
                  out(f"  Compression:       {compression}")
                  out(f"  Name:              {name}")

                  if payload_end <= size:
                      out("  Boundary check:    PASS")
                  else:
                      out("  Boundary check:    FAIL")

          out()

          # ------------------------------------------------------
          # SquashFS
          # ------------------------------------------------------
          out("=" * 72)
          out("SQUASHFS SCAN")
          out("=" * 72)

          squash_positions = find_all(data, b"hsqs")

          if not squash_positions:
              out("No little-endian SquashFS magic found.")
          else:
              for n, pos in enumerate(squash_positions, 1):
                  out()
                  out(f"[SquashFS #{n}] BIN offset = {hx(pos)} ({pos})")

                  # SquashFS superblock is 96 bytes.
                  if pos + 96 > size:
                      out("  ERROR: incomplete SquashFS superblock")
                      continue

                  (
                      magic,
                      inode_count,
                      mkfs_time,
                      block_size,
                      fragments,
                      compression,
                      block_log,
                      flags,
                      no_ids,
                      major,
                      minor,
                      root_inode,
                      bytes_used,
                      id_table_start,
                      xattr_id_table_start,
                      inode_table_start,
                      directory_table_start,
                      fragment_table_start,
                      lookup_table_start,
                  ) = struct.unpack_from(
                      "<5I6H8Q",
                      data,
                      pos
                  )

                  fs_end = pos + bytes_used

                  out(f"  Inodes:             {inode_count}")
                  out(f"  Block size:         {block_size}")
                  out(f"  Compression ID:     {compression}")
                  out(f"  Version:            {major}.{minor}")
                  out(f"  Bytes used:         {bytes_used}")
                  out(f"  Filesystem end:     {hx(fs_end)} ({fs_end})")

                  if fs_end <= size:
                      out("  Boundary check:     PASS")
                  else:
                      out("  Boundary check:     FAIL")

          # ------------------------------------------------------
          # DTB
          # ------------------------------------------------------
          out()
          out("=" * 72)
          out("DEVICE TREE / FDT SCAN")
          out("=" * 72)

          dtbs = find_all(data, b"\xd0\x0d\xfe\xed")

          if not dtbs:
              out("No FDT/DTB magic found.")
          else:
              for n, pos in enumerate(dtbs, 1):
                  out()
                  out(f"[FDT #{n}] BIN offset = {hx(pos)} ({pos})")

                  if pos + 40 > size:
                      out("  ERROR: incomplete FDT header")
                      continue

                  (
                      magic,
                      total_size,
                      off_struct,
                      off_strings,
                      off_rsvmap,
                      version,
                      last_version,
                      boot_cpuid,
                      size_strings,
                      size_struct,
                  ) = struct.unpack_from(">10I", data, pos)

                  out(f"  Total size:         {total_size}")
                  out(f"  Version:            {version}")
                  out(f"  Structure size:     {size_struct}")
                  out(f"  Strings size:       {size_strings}")
                  out(f"  FDT end:            {hx(pos + total_size)}")

          # ------------------------------------------------------
          # Known partition candidates
          # ------------------------------------------------------
          out()
          out("=" * 72)
          out("FLASH PARTITION CANDIDATES")
          out("=" * 72)

          candidates = [
              ("Original firmware", 0x160000, 0xEA0000),
              ("Modified firmware", 0x050000, 0xFB0000),
          ]

          for name, start, part_size in candidates:
              end = start + part_size

              out()
              out(name)
              out(f"  start:              {hx(start)}")
              out(f"  size:               {hx(part_size)}")
              out(f"  size KiB:           {part_size / 1024:.0f}")
              out(f"  size MiB:           {part_size / 1024 / 1024:.6f}")
              out(f"  end:                 {hx(end)}")
              out(f"  16 MiB boundary:    {'PASS' if end == 0x1000000 else 'FAIL'}")

              if size <= part_size:
                  remaining = part_size - size
                  out(f"  BIN fits:           YES")
                  out(f"  Remaining:          {hx(remaining)} ({remaining / 1024:.2f} KiB)")
              else:
                  overflow = size - part_size
                  out(f"  BIN fits:           NO")
                  out(f"  Overflow:           {hx(overflow)}")

          # ------------------------------------------------------
          # IMAGE_SIZE candidates
          # ------------------------------------------------------
          out()
          out("=" * 72)
          out("IMAGE_SIZE COMPARISON")
          out("=" * 72)

          for image_size in [14976, 16064]:
              capacity = image_size * 1024
              out()
              out(f"IMAGE_SIZE = {image_size}k")
              out(f"Capacity = {capacity} bytes")
              out(f"Capacity = {capacity / 1024 / 1024:.6f} MiB")

              if size <= capacity:
                  out("BIN fits: YES")
                  out(f"Remaining: {capacity - size} bytes")
              else:
                  out("BIN fits: NO")
                  out(f"Overflow: {size - capacity} bytes")

          # ------------------------------------------------------
          # Search source files in reference repository
          # ------------------------------------------------------
          out()
          out("=" * 72)
          out("REFERENCE SOURCE FILES")
          out("=" * 72)

          interesting = [
              REPO / "target/linux/ramips/dts/mt7628an_xiaomi_mi-router-4.dtsi",
              REPO / "target/linux/ramips/dts/mt7628an_xiaomi_mi-router-4a-100m.dts",
              REPO / "target/linux/ramips/image/mt76x8.mk",
          ]

          found_source = []

          for p in interesting:
              if p.is_file():
                  found_source.append(p)
                  out()
                  out(f"FOUND: {p.relative_to(REPO)}")
                  out("-" * 72)

                  text = p.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )

                  keywords = [
                      "partition@30000",
                      "partition@40000",
                      "partition@50000",
                      "partition@60000",
                      "partition@160000",
                      "factory",
                      "crash",
                      "cfg_bak",
                      "firmware",
                      "IMAGE_SIZE",
                  ]

                  for i, line in enumerate(text.splitlines(), 1):
                      if any(k in line for k in keywords):
                          out(f"{i:5d}: {line}")

          # ------------------------------------------------------
          # Explicit mathematical verification
          # ------------------------------------------------------
          out()
          out("=" * 72)
          out("MATHEMATICAL VERIFICATION")
          out("=" * 72)

          out()
          out("Original layout:")
          out("  0x160000 + 0xEA0000 = 0x1000000")
          out(
              f"  Result: {'PASS' if 0x160000 + 0xEA0000 == 0x1000000 else 'FAIL'}"
          )

          out()
          out("Modified layout:")
          out("  0x050000 + 0xFB0000 = 0x1000000")
          out(
              f"  Result: {'PASS' if 0x050000 + 0xFB0000 == 0x1000000 else 'FAIL'}"
          )

          out()
          out("16 MiB:")
          out("  0x1000000 = 16777216 bytes")
          out("  16777216 / 1024 / 1024 = 16 MiB")

          # ------------------------------------------------------
          # Critical conclusion
          # ------------------------------------------------------
          out()
          out("=" * 72)
          out("CRITICAL INTERPRETATION")
          out("=" * 72)
          out()

          out("1. The BIN itself does NOT encode its SPI-NOR firmware")
          out("   partition start address.")
          out()

          out("2. Therefore a BIN-only analysis cannot legitimately prove")
          out("   that firmware starts at 0x50000.")
          out()

          out("3. The reference repository's DTS is required to determine")
          out("   which Flash partition the original firmware was designed")
          out("   to occupy.")
          out()

          out("4. The BIN size can nevertheless be compared against the")
          out("   available partition sizes.")
          out()

          if size <= 0xEA0000:
              out("5. This BIN fits inside the original 0x160000-0x1000000")
              out("   firmware partition.")
          else:
              out("5. This BIN does NOT fit inside the original firmware")
              out("   partition.")

          if size <= 0xFB0000:
              out("6. This BIN fits inside the proposed 0x50000-0x1000000")
              out("   firmware partition.")
          else:
              out("6. This BIN does NOT fit inside the proposed firmware")
              out("   partition.")

          out()
          out("7. The decisive evidence for 0x50000 vs 0x160000 must come")
          out("   from the known-working firmware's DTS/image definition")
          out("   and/or actual MTD partition information from the running")
          out("   router.")
          out()

          out("=" * 72)
          out("END OF ANALYSIS")
          out("=" * 72)

          REPORT.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("\n".join(lines))
          print()
          print(f"REPORT: {REPORT}")
          PY

      # ==========================================================
      # 5. Verify report exists before doing anything else
      # ==========================================================
      - name: Verify analysis output
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          REPORT="$ROOT/r4a-100m-analysis.txt"

          if [ ! -f "$REPORT" ]; then
            echo "ERROR: analysis report was not created."
            exit 1
          fi

          if [ ! -s "$REPORT" ]; then
            echo "ERROR: analysis report is empty."
            exit 1
          fi

          echo "Report:"
          ls -lh "$REPORT"

          echo
          echo "SHA256 of report:"
          sha256sum "$REPORT"

      # ==========================================================
      # 6. Prepare immutable analysis artifact
      # ==========================================================
      - name: Prepare artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BIN="$(cat "$ROOT/firmware-path.txt")"

          rm -rf "$ROOT/output"
          mkdir -p "$ROOT/output"

          cp "$BIN" "$ROOT/output/"

          cp \
            "$ROOT/r4a-100m-analysis.txt" \
            "$ROOT/output/"

          (
            cd "$ROOT/output"
            sha256sum * > SHA256SUMS.txt
          )

          echo "============================================================"
          echo "ARTIFACT"
          echo "============================================================"

          find "$ROOT/output" \
            -maxdepth 1 \
            -type f \
            -printf '%f\t%s bytes\n' \
            | sort

      # ==========================================================
      # 7. Upload
      # ==========================================================
      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: r4a-100m-firmware-analysis
          path: ${{ github.workspace }}/output/
          retention-days: 30
          if-no-files-found: error
