name: Inspect Firmware MTD & Strings
on:
  workflow_dispatch:

jobs:
  inspect-fw:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk u-boot-tools binutils

      - name: Clone Target Repository
        uses: actions/checkout@v4
        with:
          repository: 'AshxL/router-r4a-100m'
          ref: 'main'
          lfs: true
          path: 'firmware-repo'

      - name: Extract Firmware & Find MTD Layout
        run: |
          FW_FILE="firmware-repo/miwifi_r4ac_firmware_e9eec_2.18.58.bin"
          
          echo "=== 1. Binwalk 扫描固件结构 ==="
          binwalk "$FW_FILE"

          echo "=== 2. 搜索分区关键字（MTD 布局）==="
          strings "$FW_FILE" | grep -E "mtdparts=|Bootloader|OS1|Factory|rootfs" | head -n 30 || true

          echo "=== 3. 搜索内核版本信息 ==="
          strings "$FW_FILE" | grep -i "Linux version" || true
