name: Build Clean Padavan - Xiaomi Mi 4A 100M

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

  # ==========================================================
  # Main Padavan source
  # ==========================================================
  HAN_REPO: https://github.com/hanwckf/rt-n56u.git
  HAN_REF: master

  # ==========================================================
  # MI-4A-100M hardware definition source
  #
  # IMPORTANT:
  # This is NOT the Padavan source tree.
  # Only 3 hardware files are imported.
  #
  # 9211808 is a fixed yuos-bit commit containing the
  # MI-4A-100M board definition.
  # ==========================================================
  YUOS_REF: 9211808

jobs:
  build:
    name: MI-4A-100M Clean Padavan
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ========================================================
      # 1. Checkout only YOUR workflow repository
      # ========================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ========================================================
      # 2. Install official hanwckf build dependencies
      # ========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            unzip \
            libtool-bin \
            curl \
            cmake \
            gperf \
            gawk \
            flex \
            bison \
            nano \
            xxd \
            fakeroot \
            kmod \
            cpio \
            git \
            python3-docutils \
            gettext \
            automake \
            autopoint \
            texinfo \
            build-essential \
            help2man \
            pkg-config \
            zlib1g-dev \
            libgmp3-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libltdl-dev \
            wget \
            libc-dev-bin

      # ========================================================
      # 3. Clone hanwckf/rt-n56u automatically
      # ========================================================
      - name: Clone hanwckf rt-n56u
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${HAN_REF}" \
            "${HAN_REPO}" \
            rt-n56u

          cd rt-n56u

          echo "=================================================="
          echo "hanwckf/rt-n56u"
          echo "=================================================="

          git log -1 --format='Commit : %H%nDate   : %ci%nSubject: %s'

      # ========================================================
      # 4. Import ONLY MI-4A-100M board hardware files
      #
      # board.h
      # board.mk
      # kernel-3.4.x.config
      #
      # No yuos source tree is used.
      # ========================================================
      - name: Import MI-4A-100M hardware files
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          BOARD_DIR="trunk/configs/boards/MI-4A-100M"

          mkdir -p "${BOARD_DIR}"

          BASE_URL="https://raw.githubusercontent.com/yuos-bit/Padavan/${YUOS_REF}/trunk/configs/boards/MI-4A-100M"

          curl -fL \
            "${BASE_URL}/board.h" \
            -o "${BOARD_DIR}/board.h"

          curl -fL \
            "${BASE_URL}/board.mk" \
            -o "${BOARD_DIR}/board.mk"

          curl -fL \
            "${BASE_URL}/kernel-3.4.x.config" \
            -o "${BOARD_DIR}/kernel-3.4.x.config"

          echo "=================================================="
          echo "Imported files"
          echo "=================================================="

          ls -lah "${BOARD_DIR}"

      # ========================================================
      # 5. Verify MI-4A-100M hardware definition
      # ========================================================
      - name: Verify MI-4A-100M hardware definition
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          BOARD_DIR="trunk/configs/boards/MI-4A-100M"

          test -s "${BOARD_DIR}/board.h"
          test -s "${BOARD_DIR}/board.mk"
          test -s "${BOARD_DIR}/kernel-3.4.x.config"

          # -----------------------------
          # Board identity
          # -----------------------------
          grep -q 'BOARD_PID.*MI-4A-100M' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_NAME.*MI-4A-100M' \
            "${BOARD_DIR}/board.h"

          # -----------------------------
          # Reset / LEDs
          # -----------------------------
          grep -q 'BOARD_GPIO_BTN_RESET.*38' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_GPIO_LED_WIFI.*11' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_GPIO_LED_POWER.*24' \
            "${BOARD_DIR}/board.h"

          # -----------------------------
          # Wireless hardware
          # -----------------------------
          grep -q 'BOARD_HAS_5G_11AC.*1' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_NUM_ANT_5G_TX.*2' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_NUM_ANT_5G_RX.*2' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_NUM_ANT_2G_TX.*2' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_NUM_ANT_2G_RX.*2' \
            "${BOARD_DIR}/board.h"

          # -----------------------------
          # Ethernet hardware
          # -----------------------------
          grep -q 'BOARD_NUM_ETH_EPHY.*3' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_HAS_EPHY_L1000.*0' \
            "${BOARD_DIR}/board.h"

          grep -q 'BOARD_HAS_EPHY_W1000.*0' \
            "${BOARD_DIR}/board.h"

          # -----------------------------
          # No USB
          # -----------------------------
          grep -q 'BOARD_NUM_USB_PORTS=0' \
            "${BOARD_DIR}/board.mk"

          # -----------------------------
          # CPU / RAM
          # -----------------------------
          grep -q '^CONFIG_RALINK_MT7628=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_MT7628_ASIC=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT2880_DRAM_64M=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RALINK_RAM_SIZE=64$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          # -----------------------------
          # WAN/LAN mapping
          # -----------------------------
          grep -q '^CONFIG_RAETH_ESW_PORT_WAN=0$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RAETH_ESW_PORT_LAN1=4$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RAETH_ESW_PORT_LAN2=2$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RAETH_ESW_PORT_LAN3=3$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RAETH_ESW_PORT_LAN4=1$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          # -----------------------------
          # 2.4 GHz
          # -----------------------------
          grep -q '^CONFIG_RT_FIRST_IF_MT7628=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_FIRST_IF_RANGE_2GHZ=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_FIRST_IF_EEPROM_FLASH=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_FIRST_IF_RF_OFFSET=0x40000$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_FIRST_CARD=7628$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          # -----------------------------
          # 5 GHz MT7612E
          # -----------------------------
          grep -q '^CONFIG_RT_SECOND_IF_MT7612E=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_SECOND_IF_RANGE_5GHZ=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_SECOND_IF_EEPROM_FLASH=y$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_SECOND_IF_RF_OFFSET=0x48000$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_RT_SECOND_CARD=7612$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_MT7628_AP=m$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          grep -q '^CONFIG_MT76X2_AP=m$' \
            "${BOARD_DIR}/kernel-3.4.x.config"

          echo "=================================================="
          echo "MI-4A-100M hardware verification: PASS"
          echo "=================================================="

      # ========================================================
      # 6. Cache official hanwckf prebuilt toolchain
      # ========================================================
      - name: Cache Padavan toolchain
        uses: actions/cache@v4
        with:
          path: rt-n56u/toolchain-mipsel/toolchain-3.4.x
          key: padavan-mipsel-toolchain-v1.1

      # ========================================================
      # 7. Download official hanwckf toolchain
      #
      # dl_toolchain.sh currently points to:
      # hanwckf/padavan-toolchain v1.1
      # ========================================================
      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u/toolchain-mipsel

          if [ ! -d "toolchain-3.4.x" ]; then
            sh dl_toolchain.sh
          else
            echo "Toolchain restored from cache."
          fi

          test -d toolchain-3.4.x

          find toolchain-3.4.x -maxdepth 2 -type f \
            | head -20

      # ========================================================
      # 8. Create clean MI-4A-100M configuration
      #
      # Base:
      #   hanwckf's native MI-NANO MT7628 template
      #
      # We DO NOT erase all CONFIG_FIRMWARE_INCLUDE_* entries.
      # Only explicitly known optional components are disabled.
      # ========================================================
      - name: Create clean firmware configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          SRC="trunk/configs/templates/MI-NANO.config"
          DST="trunk/configs/templates/MI-4A-100M.config"

          test -f "${SRC}"

          cp -f "${SRC}" "${DST}"

          # ------------------------------------------------------
          # Helper:
          # replace an existing CONFIG option, or append it.
          # ------------------------------------------------------
          set_config() {
            local key="$1"
            local value="$2"

            if grep -q "^${key}=" "${DST}"; then
              sed -i -E \
                "s|^${key}=.*$|${key}=${value}|" \
                "${DST}"
            else
              printf '%s=%s\n' "${key}" "${value}" >> "${DST}"
            fi
          }

          # ------------------------------------------------------
          # Product / platform
          # ------------------------------------------------------
          set_config CONFIG_VENDOR Ralink
          set_config CONFIG_PRODUCT MT7628
          set_config CONFIG_FIRMWARE_PRODUCT_ID '"MI-4A-100M"'
          set_config CONFIG_LINUXDIR linux-3.4.x

          # ------------------------------------------------------
          # Core networking
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_SFE y
          set_config CONFIG_FIRMWARE_ENABLE_IPV6 y

          # ------------------------------------------------------
          # Wireless
          # Xiaomi Mi 4A 100M:
          #   2.4 GHz = MT7628
          #   5 GHz   = MT7612E
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_WIFI2_DRIVER 4.1
          set_config CONFIG_FIRMWARE_WIFI5_DRIVER 3.0

          # ------------------------------------------------------
          # Chinese WebUI
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_LANG_CN y

          # ------------------------------------------------------
          # SSH
          # Keep Dropbear, do not include OpenSSH.
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_DROPBEAR y
          set_config CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE n
          set_config CONFIG_FIRMWARE_INCLUDE_OPENSSH n

          # ------------------------------------------------------
          # No USB
          # MI-4A 100M has no USB port.
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_ENABLE_USB n
          set_config CONFIG_FIRMWARE_ENABLE_UFSD n
          set_config CONFIG_FIRMWARE_ENABLE_FAT n
          set_config CONFIG_FIRMWARE_ENABLE_EXFAT n
          set_config CONFIG_FIRMWARE_ENABLE_EXT2 n
          set_config CONFIG_FIRMWARE_ENABLE_EXT3 n
          set_config CONFIG_FIRMWARE_ENABLE_EXT4 n
          set_config CONFIG_FIRMWARE_ENABLE_XFS n
          set_config CONFIG_FIRMWARE_ENABLE_FUSE n
          set_config CONFIG_FIRMWARE_ENABLE_SWAP n

          # ------------------------------------------------------
          # No USB peripherals
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_UVC n
          set_config CONFIG_FIRMWARE_INCLUDE_HID n
          set_config CONFIG_FIRMWARE_INCLUDE_SERIAL n
          set_config CONFIG_FIRMWARE_INCLUDE_AUDIO n
          set_config CONFIG_FIRMWARE_INCLUDE_LPRD n
          set_config CONFIG_FIRMWARE_INCLUDE_U2EC n

          # ------------------------------------------------------
          # No diagnostic / disk utilities
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_TCPDUMP n
          set_config CONFIG_FIRMWARE_INCLUDE_HDPARM n
          set_config CONFIG_FIRMWARE_INCLUDE_PARTED n

          # ------------------------------------------------------
          # No file sharing
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_SMBD n
          set_config CONFIG_FIRMWARE_INCLUDE_SMBD36 n
          set_config CONFIG_FIRMWARE_INCLUDE_WINS n
          set_config CONFIG_FIRMWARE_INCLUDE_SMBD_SYSLOG n
          set_config CONFIG_FIRMWARE_INCLUDE_FTPD n

          # ------------------------------------------------------
          # No NFS / CIFS
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_NFSD n
          set_config CONFIG_FIRMWARE_INCLUDE_NFSC n
          set_config CONFIG_FIRMWARE_INCLUDE_CIFS n

          # ------------------------------------------------------
          # No QoS extras
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_QOS n
          set_config CONFIG_FIRMWARE_INCLUDE_IMQ n
          set_config CONFIG_FIRMWARE_INCLUDE_IFB n

          # ------------------------------------------------------
          # No IPSet
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_IPSET n

          # ------------------------------------------------------
          # No VPN
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_OPENVPN n
          set_config CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC n
          set_config CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE n
          set_config CONFIG_FIRMWARE_INCLUDE_WIREGUARD n

          # ------------------------------------------------------
          # No media services
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_XUPNPD n
          set_config CONFIG_FIRMWARE_INCLUDE_MINIDLNA n
          set_config CONFIG_FIRMWARE_INCLUDE_FIREFLY n
          set_config CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW n

          # ------------------------------------------------------
          # No download clients
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_TRANSMISSION n
          set_config CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL n
          set_config CONFIG_FIRMWARE_INCLUDE_ARIA n
          set_config CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL n

          # ------------------------------------------------------
          # No extra terminal / diagnostic utilities
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_CURL n
          set_config CONFIG_FIRMWARE_INCLUDE_TTYD n
          set_config CONFIG_FIRMWARE_INCLUDE_LRZSZ n
          set_config CONFIG_FIRMWARE_INCLUDE_HTOP n
          set_config CONFIG_FIRMWARE_INCLUDE_NANO n
          set_config CONFIG_FIRMWARE_INCLUDE_IPERF3 n
          set_config CONFIG_FIRMWARE_INCLUDE_MTR n
          set_config CONFIG_FIRMWARE_INCLUDE_SOCAT n
          set_config CONFIG_FIRMWARE_INCLUDE_SRELAY n

          # ------------------------------------------------------
          # No campus network clients
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT n
          set_config CONFIG_FIRMWARE_INCLUDE_GDUT_DRCOM n
          set_config CONFIG_FIRMWARE_INCLUDE_DOGCOM n
          set_config CONFIG_FIRMWARE_INCLUDE_MINIEAP n
          set_config CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT n
          set_config CONFIG_FIRMWARE_INCLUDE_MENTOHUST n

          # ------------------------------------------------------
          # No additional services / tools
          # ------------------------------------------------------
          set_config CONFIG_FIRMWARE_INCLUDE_FRPC n
          set_config CONFIG_FIRMWARE_INCLUDE_FRPS n
          set_config CONFIG_FIRMWARE_INCLUDE_TUNSAFE n
          set_config CONFIG_FIRMWARE_INCLUDE_VLMCSD n
          set_config CONFIG_FIRMWARE_INCLUDE_3PROXY n
          set_config CONFIG_FIRMWARE_INCLUDE_SMARTDNS n
          set_config CONFIG_FIRMWARE_INCLUDE_RTL_SDR n
          set_config CONFIG_FIRMWARE_INCLUDE_DUMP1090 n

          # ------------------------------------------------------
          # Show final configuration
          # ------------------------------------------------------
          echo "=================================================="
          echo "FINAL MI-4A-100M CONFIG"
          echo "=================================================="

          cat "${DST}"

          # ------------------------------------------------------
          # Mandatory sanity checks
          # ------------------------------------------------------
          grep -Fx 'CONFIG_VENDOR=Ralink' "${DST}"
          grep -Fx 'CONFIG_PRODUCT=MT7628' "${DST}"
          grep -Fx 'CONFIG_FIRMWARE_PRODUCT_ID="MI-4A-100M"' "${DST}"
          grep -Fx 'CONFIG_LINUXDIR=linux-3.4.x' "${DST}"

          grep -Fx 'CONFIG_FIRMWARE_INCLUDE_SFE=y' "${DST}"
          grep -Fx 'CONFIG_FIRMWARE_INCLUDE_LANG_CN=y' "${DST}"

          grep -Fx 'CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y' "${DST}"
          grep -Fx 'CONFIG_FIRMWARE_INCLUDE_OPENSSH=n' "${DST}"

          grep -Fx 'CONFIG_FIRMWARE_WIFI2_DRIVER=4.1' "${DST}"
          grep -Fx 'CONFIG_FIRMWARE_WIFI5_DRIVER=3.0' "${DST}"

          grep -Fx 'CONFIG_FIRMWARE_ENABLE_USB=n' "${DST}"

          echo "=================================================="
          echo "PROJECT CONFIG CHECK: PASS"
          echo "=================================================="

      # ========================================================
      # 9. Patch a TEMPORARY copy of build_firmware_modify
      #
      # We do NOT modify the hanwckf source permanently.
      #
      # The inserted step runs AFTER:
      # - kernel config copied
      # - board.h copied
      # - board.mk copied
      # - wireless Kconfigs/drivers prepared
      # - project options applied
      #
      # and BEFORE:
      # make dep
      # make
      #
      # This resolves the cross-Fork Kconfig concern non-
      # interactively.
      # ========================================================
      - name: Create CI-safe build script
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          cp -f \
            trunk/build_firmware_modify \
            trunk/build_firmware_ci

          python3 - <<'PY'
          from pathlib import Path

          path = Path("trunk/build_firmware_ci")

          text = path.read_text()

          marker = 'echo --------------------------MAKE-DEP--------------------------------'

          insert = r'''
          echo ----------------------KCONFIG-NORMALIZE-------------------------

          KCONFIG_BACKUP="$kernel_tf.pre-olddefconfig"

          cp -f "$kernel_tf" "$KCONFIG_BACKUP"

          if make olddefconfig; then
              echo "make olddefconfig: OK"
          else
              echo "olddefconfig failed, using non-interactive oldconfig fallback"

              cp -f "$KCONFIG_BACKUP" "$kernel_tf"

              yes "" | make oldconfig

              echo "make oldconfig fallback: OK"
          fi

          echo "----------------------KCONFIG-DIFF------------------------------"

          diff -u "$KCONFIG_BACKUP" "$kernel_tf" || true

          '''

          if marker not in text:
              raise SystemExit(
                  "ERROR: build_firmware_modify structure changed; "
                  "MAKE-DEP marker not found."
              )

          if "KCONFIG-NORMALIZE" in text:
              raise SystemExit(
                  "ERROR: temporary build script appears already patched."
              )

          text = text.replace(
              marker,
              insert + marker,
              1
          )

          path.write_text(text)

          PY

          chmod +x trunk/build_firmware_ci

          grep -n \
            -A35 \
            'KCONFIG-NORMALIZE' \
            trunk/build_firmware_ci

      # ========================================================
      # 10. Build
      # ========================================================
      - name: Build MI-4A-100M firmware
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u/trunk

          rm -rf images
          rm -rf romfs

          fakeroot ./build_firmware_ci MI-4A-100M

      # ========================================================
      # 11. Validate final kernel configuration
      #
      # These are the hardware-critical values that MUST NOT
      # disappear or change during olddefconfig/oldconfig.
      # ========================================================
      - name: Validate final kernel configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          KERNEL_CONFIG="linux-3.4.x/.config"

          test -s "${KERNEL_CONFIG}"

          echo "=================================================="
          echo "Final kernel hardware configuration"
          echo "=================================================="

          # CPU / RAM
          grep -Fx 'CONFIG_RALINK_MT7628=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_MT7628_ASIC=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT2880_DRAM_64M=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RALINK_RAM_SIZE=64' \
            "${KERNEL_CONFIG}"

          # Ethernet
          grep -Fx 'CONFIG_RAETH=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_GE1_MAC_ESW=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RAETH_ESW=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RAETH_ESW_PORT_WAN=0' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RAETH_ESW_PORT_LAN1=4' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RAETH_ESW_PORT_LAN2=2' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RAETH_ESW_PORT_LAN3=3' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RAETH_ESW_PORT_LAN4=1' \
            "${KERNEL_CONFIG}"

          # 2.4 GHz
          grep -Fx 'CONFIG_RT_FIRST_IF_MT7628=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_FIRST_IF_RANGE_2GHZ=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_FIRST_IF_EEPROM_FLASH=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_FIRST_IF_RF_OFFSET=0x40000' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_FIRST_CARD=7628' \
            "${KERNEL_CONFIG}"

          # 5 GHz
          grep -Fx 'CONFIG_RT_SECOND_IF_MT7612E=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_SECOND_IF_RANGE_5GHZ=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_SECOND_IF_EEPROM_FLASH=y' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_SECOND_IF_RF_OFFSET=0x48000' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_RT_SECOND_CARD=7612' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_MT7628_AP=m' \
            "${KERNEL_CONFIG}"

          grep -Fx 'CONFIG_MT76X2_AP=m' \
            "${KERNEL_CONFIG}"

          echo "=================================================="
          echo "FINAL KERNEL HARDWARE CHECK: PASS"
          echo "=================================================="

      # ========================================================
      # 12. Validate SSH / feature configuration
      # ========================================================
      - name: Validate final firmware feature configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          CONFIG="trunk/configs/templates/MI-4A-100M.config"

          # -----------------------------
          # SSH
          # -----------------------------
          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_OPENSSH=n' \
            "${CONFIG}"

          # -----------------------------
          # Basic features
          # -----------------------------
          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_LANG_CN=y' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_SFE=y' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_ENABLE_IPV6=y' \
            "${CONFIG}"

          # -----------------------------
          # Wi-Fi
          # -----------------------------
          grep -Fx \
            'CONFIG_FIRMWARE_WIFI2_DRIVER=4.1' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_WIFI5_DRIVER=3.0' \
            "${CONFIG}"

          # -----------------------------
          # No USB
          # -----------------------------
          grep -Fx \
            'CONFIG_FIRMWARE_ENABLE_USB=n' \
            "${CONFIG}"

          # -----------------------------
          # Major optional packages must
          # remain disabled.
          # -----------------------------
          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_ARIA=n' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=n' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_SMBD=n' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_SMBD36=n' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_FTPD=n' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_OPENVPN=n' \
            "${CONFIG}"

          grep -Fx \
            'CONFIG_FIRMWARE_INCLUDE_WIREGUARD=n' \
            "${CONFIG}"

          echo "=================================================="
          echo "FINAL FEATURE CHECK: PASS"
          echo "=================================================="

      # ========================================================
      # 13. Generate build information
      # ========================================================
      - name: Generate build information
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          {
            echo "=============================================="
            echo "Padavan MI-4A-100M CLEAN BUILD"
            echo "=============================================="
            echo
            echo "Source repository:"
            echo "https://github.com/hanwckf/rt-n56u"
            echo
            echo "hanwckf ref:"
            echo "${HAN_REF}"
            echo
            echo "hanwckf commit:"
            git rev-parse HEAD
            echo
            echo "hanwckf commit date:"
            git log -1 --format='%ci'
            echo
            echo "hanwckf commit subject:"
            git log -1 --format='%s'
            echo
            echo "MI-4A-100M hardware source:"
            echo "https://github.com/yuos-bit/Padavan"
            echo
            echo "yuos hardware commit:"
            echo "${YUOS_REF}"
            echo
            echo "Imported files:"
            echo "  trunk/configs/boards/MI-4A-100M/board.h"
            echo "  trunk/configs/boards/MI-4A-100M/board.mk"
            echo "  trunk/configs/boards/MI-4A-100M/kernel-3.4.x.config"
            echo
            echo "Firmware config:"
            echo "  trunk/configs/templates/MI-4A-100M.config"
            echo
            echo "SSH:"
            grep '^CONFIG_FIRMWARE_INCLUDE_DROPBEAR=' \
              trunk/configs/templates/MI-4A-100M.config
            echo
            echo "OpenSSH:"
            grep '^CONFIG_FIRMWARE_INCLUDE_OPENSSH=' \
              trunk/configs/templates/MI-4A-100M.config
            echo
            echo "IPv6:"
            grep '^CONFIG_FIRMWARE_ENABLE_IPV6=' \
              trunk/configs/templates/MI-4A-100M.config
            echo
            echo "SFE:"
            grep '^CONFIG_FIRMWARE_INCLUDE_SFE=' \
              trunk/configs/templates/MI-4A-100M.config
            echo
            echo "WiFi 2.4G driver:"
            grep '^CONFIG_FIRMWARE_WIFI2_DRIVER=' \
              trunk/configs/templates/MI-4A-100M.config
            echo
            echo "WiFi 5G driver:"
            grep '^CONFIG_FIRMWARE_WIFI5_DRIVER=' \
              trunk/configs/templates/MI-4A-100M.config
            echo
            echo "Firmware files:"
            find trunk/images \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            echo
            echo "SHA256:"
            sha256sum trunk/images/*.trx
          } > build-info.txt

          echo "=================================================="
          cat build-info.txt
          echo "=================================================="

      # ========================================================
      # 14. Show firmware size and SHA256
      # ========================================================
      - name: Verify firmware output
        shell: bash
        run: |
          set -euxo pipefail

          cd rt-n56u

          test -d trunk/images

          mapfile -t FIRMWARES < <(
            find trunk/images \
              -maxdepth 1 \
              -type f \
              -name '*.trx' \
              -print
          )

          test "${#FIRMWARES[@]}" -ge 1

          echo "=================================================="
          echo "Firmware output"
          echo "=================================================="

          for fw in "${FIRMWARES[@]}"; do
            echo
            echo "File:"
            echo "${fw}"

            echo "Size:"
            stat -c '%n : %s bytes' "${fw}"

            echo "SHA256:"
            sha256sum "${fw}"
          done

          echo
          echo "=================================================="
          echo "FIRMWARE BUILD: SUCCESS"
          echo "=================================================="

      # ========================================================
      # 15. Upload firmware + configs + build information
      # ========================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-MI-4A-100M-CLEAN
          path: |
            rt-n56u/trunk/images/*.trx
            rt-n56u/trunk/configs/templates/MI-4A-100M.config
            rt-n56u/trunk/configs/boards/MI-4A-100M/board.h
            rt-n56u/trunk/configs/boards/MI-4A-100M/board.mk
            rt-n56u/trunk/configs/boards/MI-4A-100M/kernel-3.4.x.config
            rt-n56u/linux-3.4.x/.config
            rt-n56u/build-info.txt
          if-no-files-found: error

      - name: Cache
        uses: actions/cache@v5.1.0
        with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path: 
          # An explicit key for restoring and saving the cache
          key: 
          # An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.
          restore-keys: # optional
          # The chunk size used to split up large files during upload, in bytes
          upload-chunk-size: # optional
          # An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms
          enableCrossOsArchive: # optional, default is false
          # Fail the workflow if cache entry is not found
          fail-on-cache-miss: # optional, default is false
          # Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache
          lookup-only: # optional, default is false
          # Run the post step to save the cache even if another step before fails
          save-always: # optional, default is false
